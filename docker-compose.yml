version: "3.9"

services:
  backend:
    build:
      context: ./backend
      args:
        # Set to "true" to install tshark and enable the optional PyShark
        # parser backend. Not required -- Scapy (the default) has no
        # external binary dependency.
        INSTALL_TSHARK: "false"
    container_name: voip-backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # DATABASE_URL is pinned here (not left to backend/.env) so the SQLite
      # file always resolves to /app/data, which matches the volume mount
      # below -- this is what makes call history survive a
      # `docker compose down` / rebuild. To use PostgreSQL instead, replace
      # this line (compose `environment:` takes precedence over `env_file:`,
      # so setting DATABASE_URL in backend/.env alone will NOT override it).
      - DATABASE_URL=sqlite+aiosqlite:///./data/voip_analyzer.db
      # v2.2.0: save reconstructed call audio (WAV, G.711 only) under ./data/recordings.
      # Off by default; recording calls may carry legal obligations in your jurisdiction.
      - SAVE_CALL_AUDIO=${SAVE_CALL_AUDIO:-false}
      # v2.3.0 login. The first admin is created on first start; without ADMIN_PASSWORD a random
      # password is generated and printed once in the backend log (docker compose logs backend).
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - AUTH_SECRET=${AUTH_SECRET:-}
      # v2.3.0 recording retention (recordings only; call records are kept). Checked hourly.
      - RECORDINGS_RETENTION_DAYS=${RECORDINGS_RETENTION_DAYS:-180}
      # Optional size cap in GB; the oldest recordings are deleted first. 0 = no cap.
      - RECORDINGS_MAX_GB=${RECORDINGS_MAX_GB:-0}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # v2.3.0 live capture. Optional: start it with
  #   docker compose --profile capture up -d
  # Set CAPTURE_INTERFACE in the root .env to the NIC cabled to your SPAN/mirror port
  # (list the names with: docker compose --profile capture run --rm capture python -m app.capture --list-interfaces).
  capture:
    build:
      context: ./backend
    container_name: voip-capture
    profiles: ["capture"]
    command: ["python", "-m", "app.capture"]
    # Host networking exposes the host's real NICs to the container; NET_RAW/NET_ADMIN allow sniffing.
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/voip_analyzer.db
      - RECORDINGS_DIR=/app/data/recordings
      - CAPTURE_SPOOL_DIR=/app/data/spool
      - CAPTURE_INTERFACE=${CAPTURE_INTERFACE:-eth1}
      - CAPTURE_FILTER=${CAPTURE_FILTER:-udp or tcp port 5060}
      # Recording is on by default; set to false to keep call records and quality metrics only.
      - LIVE_RECORDING_ENABLED=${LIVE_RECORDING_ENABLED:-true}
    volumes:
      - ./data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      args:
        # Must match where the backend is actually reachable from the
        # browser (not from inside the Docker network) -- typically your
        # host's address on port 8000. Override in a .env at the repo root
        # or pass --build-arg directly if self-hosting on a LAN/different host.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: voip-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
